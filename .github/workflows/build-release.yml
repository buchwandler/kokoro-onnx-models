name: build-release

on:
  workflow_dispatch:
    inputs:
      release_key:
        description: Entry from catalog/releases.json
        required: true
        type: string
      allow_restricted:
        description: Allow a release disabled by default
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.resolve.outputs.kind }}
      model_version: ${{ steps.resolve.outputs.model_version }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          RELEASE_KEY: ${{ inputs.release_key }}
          ALLOW_RESTRICTED: ${{ inputs.allow_restricted }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path("catalog/releases.json").read_text())
          key = os.environ["RELEASE_KEY"]
          try:
              spec = catalog["releases"][key]
          except KeyError as exc:
              raise SystemExit(f"Unknown release key: {key}") from exc
          publish = bool(spec.get("publish", True))
          if not publish and os.environ["ALLOW_RESTRICTED"].lower() != "true":
              raise SystemExit("Release is disabled; set allow_restricted only after reviewing its license")
          profile = spec.get("profile", key)
          if spec["kind"] == "build":
              profiles = json.loads(
                  Path("scripts/kokoro_profiles.json").read_text()
              )
              if profile not in profiles:
                  raise SystemExit(f"Build profile is missing for {key}: {profile}")
              build_release = profiles[profile].get("release") or {}
              build_runtime = build_release.get("runtime") or {}
              if build_runtime.get("voice_mode") == "reference":
                  if not build_release.get("model_assets"):
                      raise SystemExit(
                          f"Build profile {profile} is missing required model_assets mapping metadata"
                      )
              elif not build_release.get("model_filename") or not (
                  build_release.get("voice_assets") or build_release.get("voices_filename")
              ):
                  raise SystemExit(
                      f"Build profile {profile} is missing required release mapping metadata"
                  )
          model_version = spec.get("model_version")
          release_version = spec.get("release_version")
          if not isinstance(model_version, str) or not model_version:
              raise SystemExit(f"Release {key} has an invalid model_version")
          if (
              isinstance(release_version, bool)
              or not isinstance(release_version, int)
              or release_version < 1
          ):
              raise SystemExit(f"Release {key} has an invalid release_version")
          for name, value in {
              "kind": spec["kind"],
              "tag": spec["tag"],
              "profile": profile,
              "model_version": model_version,
              "release_version": release_version,
              "publish": str(publish).lower(),
          }.items():
              print(f"{name}={value}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PY

  candidate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/checkout@v4
        with:
          repository: buchwandler/pykokoro
          path: pykokoro
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: buchwandler/onnxvoice
          path: onnxvoice
          fetch-depth: 1
      - name: Cache pinned Inno tuner build inputs
        if: ${{ needs.prepare.outputs.kind == 'mirror' && needs.prepare.outputs.profile == 'v1.0' }}
        uses: actions/cache@v4
        with:
          path: build/.cache-inno-tuner
          key: inno-tuner-v0.2-429617d18ce4d637acea948bdff4cce3ec6cf167
      - name: Build Inno v0.2 enroller and run ONNX plus voicepack parity gates
        if: ${{ needs.prepare.outputs.kind == 'mirror' && needs.prepare.outputs.profile == 'v1.0' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --extra build --extra test python scripts/export_inno_tuner.py \
            --out build/inno-tuner-v0.2 --cache build/.cache-inno-tuner
          test -f build/inno-tuner-v0.2/inno-voicepack-v0.2.onnx
          test -f build/inno-tuner-v0.2/inno-tuner-v0.2.npz
          test -f build/inno-tuner-v0.2/parity-report.json
          uv run --extra build --extra test python local_test/compare_inno_onnx.py \
            --build-root build \
            --cache-root build/.cache-inno-tuner \
            --output-root .local-test/compare
          test -f .local-test/compare/en-inno-tuner-v0.2/report.json
      - name: Build or mirror release
        env:
          KIND: ${{ needs.prepare.outputs.kind }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RELEASE_KEY: ${{ inputs.release_key }}
          ALLOW_RESTRICTED: ${{ inputs.allow_restricted }}
        run: |
          if [ "$KIND" = "mirror" ]; then
            uv run --with pytest --with numpy --with 'torch>=2.6' python scripts/mirror_release.py "$RELEASE_KEY"
          else
            uv run scripts/build_kokoro.py build "$PROFILE"
            prep_args=("$PROFILE")
            if [ "$ALLOW_RESTRICTED" = "true" ]; then prep_args+=(--allow-restricted); fi
            uv run --with numpy python scripts/prepare_release.py "${prep_args[@]}"
          fi
      - name: Checkpoint A/B and staged consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'de-thorsten' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          uv run --extra build python local_test/compare_checkpoint_onnx.py de-thorsten --runs 5 --seed 20260828 --keep-build
          test -f ".local-test/compare/de-thorsten/report.json"
      - name: European Portuguese checkpoint A/B gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'pt-eu-logus2k' }}
        run: |
          uv run --extra build python local_test/compare_checkpoint_onnx.py pt-eu-logus2k --runs 5 --seed 20260828 --keep-build
          test -f ".local-test/compare/pt-eu-logus2k/report.json"
      - name: Swedish checkpoint A/B and staged consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'sv-joakim' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          uv run --extra build python local_test/compare_checkpoint_onnx.py sv-joakim --runs 5 --seed 20260828 --keep-build
          test -f ".local-test/compare/sv-joakim/report.json"
      - name: Vietnamese Ngọc Huyền checkpoint A/B and staged consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'vi-ngoc-huyen' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          uv run --extra build python local_test/compare_checkpoint_onnx.py vi-ngoc-huyen --runs 5 --seed 20260828 --keep-build
          test -f ".local-test/compare/vi-ngoc-huyen/report.json"
      - name: Russian Zaakirio checkpoint A/B and staged consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && (needs.prepare.outputs.profile == 'ru-zaakirio-base' || needs.prepare.outputs.profile == 'ru-zaakirio-dima') }}
        run: |
          uv run --extra build python local_test/compare_checkpoint_onnx.py "${{ needs.prepare.outputs.profile }}" --runs 5 --seed 20260828 --keep-build
          test -f ".local-test/compare/${{ needs.prepare.outputs.profile }}/report.json"
      - name: AkinVox cloning PyTorch/ONNX A/B gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'en-akinvox-cloning-v1' }}
        run: |
          uv run --python 3.12 --extra build --extra test \
            python local_test/compare_akinvox_cloning_onnx.py --seed 20260926 --keep-build
          test -f ".local-test/compare/en-akinvox-cloning-v1/report.json"
          test -f ".local-test/compare/en-akinvox-cloning-v1/parity-report.json"
      - name: Verify candidate
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MODEL_VERSION: ${{ needs.prepare.outputs.model_version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
          ALLOW_RESTRICTED: ${{ inputs.allow_restricted }}
        run: |
          args=(--expected-tag "$TAG" --expected-profile "$PROFILE" --expected-model-version "$MODEL_VERSION" --expected-release-version "$RELEASE_VERSION")
          if [ "$ALLOW_RESTRICTED" = "true" ]; then args+=(--allow-restricted); fi
          uv run python scripts/verify_candidate.py "dist/$TAG" "${args[@]}"
      - name: Install eSpeak NG for pykokoro consumer frontend
        if: >-
          ${{
            (needs.prepare.outputs.kind == 'build' &&
             (needs.prepare.outputs.profile == 'de-anna' ||
              needs.prepare.outputs.profile == 'ar-nabra' ||
              needs.prepare.outputs.profile == 'sv-joakim' ||
              needs.prepare.outputs.profile == 'vi-ngoc-huyen' ||
              needs.prepare.outputs.profile == 'ru-zaakirio-base' ||
              needs.prepare.outputs.profile == 'ru-zaakirio-dima')) ||
            (needs.prepare.outputs.kind == 'mirror' &&
             needs.prepare.outputs.profile == 'v1.0')
          }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y espeak-ng
      - name: German Anna pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'de-anna' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" \
          uv run --project pykokoro --extra cpu \
          python local_test/smoke_de_software_mansion_anna.py \
            --asset-dir "dist/${{ needs.prepare.outputs.tag }}" \
            --strict-release-format
      - name: Arabic Nabra pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'ar-nabra' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" \
          uv run --project pykokoro --extra cpu \
          python local_test/smoke_ar_nabra.py \
            --asset-dir "dist/${{ needs.prepare.outputs.tag }}" \
            --strict-release-format
      - name: Kokoro v1.0 pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'mirror' && needs.prepare.outputs.profile == 'v1.0' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" \
          uv run \
            --project pykokoro \
            --extra cpu \
            --with 'kokorog2p[ja,zh]>=0.9.5,<1.0' \
            python local_test/smoke_v1_0.py \
              --asset-dir "dist/${{ needs.prepare.outputs.tag }}" \
              --strict-release-format
      - name: Staged pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'de-thorsten' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" uv run --project pykokoro --extra cpu python local_test/smoke_de_thorsten.py --asset-dir "dist/${{ needs.prepare.outputs.tag }}" --strict-release-format
      - name: Swedish pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'sv-joakim' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" uv run --project pykokoro --extra cpu python local_test/smoke_sv_joakim.py --asset-dir "dist/${{ needs.prepare.outputs.tag }}" --strict-release-format
      - name: Vietnamese Ngọc Huyền pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'vi-ngoc-huyen' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" uv run --project pykokoro --extra cpu python local_test/smoke_vi_ngoc_huyen.py --asset-dir "dist/${{ needs.prepare.outputs.tag }}" --strict-release-format
      - name: Russian Zaakirio pykokoro consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && (needs.prepare.outputs.profile == 'ru-zaakirio-base' || needs.prepare.outputs.profile == 'ru-zaakirio-dima') }}
        run: |
          if [ "${{ needs.prepare.outputs.profile }}" = "ru-zaakirio-base" ]; then
            smoke=local_test/smoke_ru_zaakirio_base.py
          else
            smoke=local_test/smoke_ru_zaakirio_dima.py
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" uv run --project pykokoro --extra cpu python "$smoke" --asset-dir "dist/${{ needs.prepare.outputs.tag }}" --strict-release-format
      - name: AkinVox cloning pykokoro + onnxvoice consumer gate
        if: ${{ needs.prepare.outputs.kind == 'build' && needs.prepare.outputs.profile == 'en-akinvox-cloning-v1' }}
        run: |
          test -f "$GITHUB_WORKSPACE/onnxvoice/onnxvoice/systems/kokoro_cloning.py"
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" \
          uv run --project pykokoro --extra cpu --with "$GITHUB_WORKSPACE/onnxvoice" \
          python local_test/smoke_en_akinvox_cloning.py \
            --asset-dir "dist/${{ needs.prepare.outputs.tag }}" \
            --strict-release-format
          test -f ".local-test/smoke/en-akinvox-cloning-v1/report.json"
      - name: Inno enrollment and staged PyKokoro synthesis gate
        if: ${{ needs.prepare.outputs.kind == 'mirror' && needs.prepare.outputs.profile == 'v1.0' }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/pykokoro" \
          uv run \
            --project pykokoro \
            --extra cpu \
            --with 'kokorog2p>=0.9.5,<1.0' \
            --with scipy --with soundfile --with safetensors --with praat-parselmouth --with torch \
            python local_test/compare_inno_onnx.py \
              --build-root build \
              --cache-root build/.cache-inno-tuner \
              --output-root .local-test/compare \
              --synthesis \
              --asset-dir "dist/${{ needs.prepare.outputs.tag }}"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-candidate-${{ inputs.release_key }}-${{ github.sha }}
          path: |
            dist/${{ needs.prepare.outputs.tag }}
            .local-test/compare/de-thorsten
            .local-test/compare/en-inno-tuner-v0.2
            .local-test/compare/pt-eu-logus2k
            .local-test/compare/sv-joakim
            .local-test/compare/vi-ngoc-huyen
            .local-test/compare/ru-zaakirio-base
            .local-test/compare/ru-zaakirio-dima
            .local-test/compare/en-akinvox-cloning-v1
            .local-test/smoke/en-akinvox-cloning-v1
          compression-level: 0
          if-no-files-found: error
