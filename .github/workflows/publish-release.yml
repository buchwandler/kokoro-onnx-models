name: publish-release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed build-release workflow run ID
        required: true
        type: string
      candidate_commit:
        description: Commit used to build the candidate
        required: true
        type: string
      release_key:
        description: Entry from catalog/releases.json
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  RELEASE_REPOSITORY: buchwandler/kokoro-onnx-models


concurrency:
  group: kokoro-model-catalog-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
          name: kokoro-candidate-${{ inputs.release_key }}-${{ inputs.candidate_commit }}
          path: candidate
      - name: Resolve and verify release metadata
        id: resolve
        env:
          RELEASE_KEY: ${{ inputs.release_key }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          catalog = json.loads(Path("catalog/releases.json").read_text())
          key = os.environ["RELEASE_KEY"]
          try:
              spec = catalog["releases"][key]
          except KeyError as exc:
              raise SystemExit(f"Unknown release key: {key}") from exc
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as output:
              print(f"tag={spec['tag']}", file=output)
              print(f"profile={spec.get('profile', key)}", file=output)
              print(f"model_version={spec['model_version']}", file=output)
              print(f"release_version={spec['release_version']}", file=output)
          PY
          TAG="$(awk -F= '/^tag=/{print $2}' "$GITHUB_OUTPUT" | tail -1)"
          PROFILE="$(awk -F= '/^profile=/{print $2}' "$GITHUB_OUTPUT" | tail -1)"
          MODEL_VERSION="$(awk -F= '/^model_version=/{print $2}' "$GITHUB_OUTPUT" | tail -1)"
          RELEASE_VERSION="$(awk -F= '/^release_version=/{print $2}' "$GITHUB_OUTPUT" | tail -1)"
          manifest="$(find candidate -type f -name release-manifest.json -print -quit)"
          if [ -z "$manifest" ]; then
            echo "Downloaded artifact does not contain release-manifest.json" >&2
            find candidate -maxdepth 5 -type f -print >&2
            exit 1
          fi
          CANDIDATE_DIR="$(dirname "$manifest")"
          printf 'candidate_dir=%s\n' "$CANDIDATE_DIR" >> "$GITHUB_OUTPUT"
          uv run python scripts/verify_candidate.py "$CANDIDATE_DIR" \
            --expected-tag "$TAG" \
            --expected-profile "$PROFILE" \
            --expected-model-version "$MODEL_VERSION" \
            --expected-release-version "$RELEASE_VERSION" \
            --expected-builder-commit "$CANDIDATE_COMMIT"
      - name: Compare or publish exact candidate bytes
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          CANDIDATE_DIR: ${{ steps.resolve.outputs.candidate_dir }}
          PROFILE: ${{ steps.resolve.outputs.profile }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            rm -rf existing
            mkdir existing
            gh release download "$TAG" --repo "$RELEASE_REPOSITORY" --pattern release-manifest.json --dir existing --clobber
            python scripts/release_all.py compare \
              --candidate "$CANDIDATE_DIR/release-manifest.json" \
              --existing existing/release-manifest.json
            echo "Release tag already published with identical candidate: $TAG"
          else
            python scripts/update_registry_from_release.py "$CANDIDATE_DIR" --profile "$PROFILE" --preflight-publish
            gh release create "$TAG" "$CANDIDATE_DIR"/* \
              --repo "$RELEASE_REPOSITORY" \
              --title "$TAG" \
              --notes-file "$CANDIDATE_DIR/release-notes.md"
          fi

  sync-catalog:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_KEY: ${{ inputs.release_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
          name: kokoro-candidate-${{ inputs.release_key }}-${{ inputs.candidate_commit }}
          path: candidate
      - name: Synchronize and verify runtime registry
        run: |
          set -euo pipefail
          manifest="$(find candidate -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          candidate_dir="$(dirname "$manifest")"
          profile="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile"])' "$manifest")"
          tag="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$manifest")"
          model_version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["model_version"])' "$manifest")"
          release_version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_version"])' "$manifest")"
          echo "release key: $RELEASE_KEY"
          echo "profile: $profile"
          echo "model version: $model_version"
          echo "release version: $release_version"
          echo "tag: $tag"
          uv run python scripts/verify_candidate.py "$candidate_dir" \
            --expected-tag "$tag" \
            --expected-profile "$profile" \
            --expected-model-version "$model_version" \
            --expected-release-version "$release_version"
          python scripts/update_registry_from_release.py "$candidate_dir" --profile "$profile" --update
          python scripts/verify_model_registry.py
          python scripts/collect_runtime_metadata.py --check
      - name: Commit registry update when needed
        run: |
          if git diff --quiet -- catalog/models.json; then
            echo "catalog/models.json is already synchronized"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/models.json
          git commit -m "chore: synchronize model registry for $RELEASE_KEY"
          git pull --rebase origin main
          python scripts/verify_model_registry.py
          python scripts/collect_runtime_metadata.py --check
          git show HEAD^:catalog/models.json > /tmp/models-before.json
          python scripts/check_registry_immutability.py \
            --before /tmp/models-before.json \
            --after catalog/models.json
          git push origin HEAD:main
